 function campaignCard(c){const st=c.status==='active'?'active':c.status==='paused'?'paused':'';const statusLabel=c.status==='active'?tr('activeStatus'):c.status==='paused'?tr('pausedStatus'):c.status==='cancelled'?tr('cancelledStatus'):tr('completeStatus');return `<article class="item"><div class="item-top"><div class="item-icon">${iconFor(c.type)}</div><div class="item-main"><div class="item-title">${escapeHtml(c.title)}</div><div class="item-meta"><span class="tag">${escapeHtml(c.typeLabel||tr(c.type))}</span><span class="status ${st}">${statusLabel}</span></div></div><div class="reward">${num(c.status==='active'?c.remaining*c.cost:0)} ${tr('pointsShort')}</div></div><div class="progress"><span style="width:${Math.max(0,Math.min(100,c.progress||0))}%"></span></div><div class="progress-row"><span>${tr('progress')} · ${num(c.done)}/${num(c.target)}</span><span>${num(c.progress)}%</span></div>${c.canStop?`<div class="item-actions"><button class="btn btn-danger" data-stop-campaign="${escapeHtml(c.id)}">${tr('stop')}</button>${c.postUrl?`<button class="btn btn-secondary" data-open-url="${escapeHtml(c.postUrl)}">${tr('viewPost')}</button>`:''}</div>`:''}</article>`;}
 function channelGate(){if(state.channelRequired)return `${empty(tr('joinChannelRequired'),tr('joinChannelMessage'))}${state.tasksChannelUrl?`<button class="btn btn-primary" style="width:100%;margin-top:10px" data-open-url="${escapeHtml(state.tasksChannelUrl)}">◉ ${tr('joinTaskChannel')}</button>`:''}`;if(state.membershipCheckUnavailable)return empty(tr('membershipCheckUnavailable'),tr('membershipCheckMessage'));return '';}
 function renderHome(){const u=state.user||{},s=state.stats||{};const recent=state.tasks.slice(0,3);return `<section class="hero-shell"><div class="hero-copy"><div class="hero-kicker"><i></i>${tr('community')}</div><h1 class="hero-headline">${tr('heroLine1')}<br><span>${tr('heroLine2')}</span></h1><p class="hero-desc">${tr('heroDesc')}</p><div class="hero-actions"><button class="btn btn-primary" data-goto="tasks">${tr('startTasks')} ↗</button><button class="btn btn-secondary" data-create>＋ ${tr('createCampaign')}</button></div></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 240 230" role="img"><defs><linearGradient id="orb" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#b19aff"/><stop offset="1" stop-color="#54f2df"/></linearGradient><radialGradient id="core"><stop stop-color="#c0fff8"/><stop offset=".18" stop-color="#79eee3"/><stop offset=".55" stop-color="#6a55d9" stop-opacity=".7"/><stop offset="1" stop-color="#6a55d9" stop-opacity="0"/></radialGradient></defs><circle cx="128" cy="110" r="76" fill="url(#core)" opacity=".55"/><circle class="art-orbit" cx="128" cy="110" r="83" transform="rotate(-25 128 110)"/><ellipse class="art-orbit" cx="128" cy="110" rx="101" ry="40" transform="rotate(-43 128 110)"/><ellipse class="art-orbit" cx="128" cy="110" rx="95" ry="49" transform="rotate(42 128 110)"/><path class="art-line" d="M27 154 L70 154 L88 126 L108 126 L126 88 L147 88 L165 65 L194 65"/><path d="M35 174 L72 174 L93 155 L115 155 L135 129 L154 129 L178 100 L202 100" fill="none" stroke="#ad8cff" stroke-opacity=".45" stroke-width="1.5"/><circle cx="128" cy="110" r="34" fill="none" stroke="url(#orb)" stroke-width="1.6"/><circle cx="128" cy="110" r="23" fill="url(#core)"/><path d="M114 111 L124 121 L144 97" fill="none" stroke="#e1fffb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="154" r="4" fill="#70f5e8"/><circle cx="165" cy="65" r="4" fill="#b29aff"/><circle cx="178" cy="100" r="3.5" fill="#70f5e8"/><circle cx="88" cy="126" r="3" fill="#df9ae9"/><path d="M32 48 H61 M32 55 H49 M175 182 H205 M190 189 H205" stroke="#b9a8ff" stroke-opacity=".48" stroke-linecap="round"/></svg><div class="art-chip one"><small>${tr('available').toUpperCase()}</small><strong>${num(s.availableTasks)}</strong></div><div class="art-chip two"><small>${tr('campaigns').toUpperCase()}</small><strong>${num(s.activeCampaigns)} ${tr('activeStatus')}</strong></div></div></section><section class="balance"><div class="balance-head"><span>✦ ${tr('balance')}</span><span class="pill"><i class="dot"></i> ${tr('accountActive')}</span></div><div class="balance-amount">${num(u.points)} <small>${tr('pointsShort')}</small></div><div class="balance-sub">${tr('hold')}: ${num(u.hold)} · ${tr('earned')}: ${num(u.earned)}</div></section><section class="stats"><div class="stat"><div class="stat-icon">✦</div><div class="stat-num">${num(s.availableTasks)}</div><div class="stat-label">${tr('available')}</div></div><div class="stat"><div class="stat-icon">▤</div><div class="stat-num">${num(s.activeCampaigns)}</div><div class="stat-label">${tr('active')}</div></div><div class="stat"><div class="stat-icon">✓</div><div class="stat-num">${num(s.completedTasks)}</div><div class="stat-label">${tr('completed')}</div></div></section><div class="section-head"><h2 class="section-title">${tr('quickActions')}</h2></div><section class="quick-grid"><button class="quick" data-goto="tasks"><span class="quick-icon">↗</span><span><span class="quick-title">${tr('startTasks')}</span><div class="quick-sub">${tr('taskOpenInfo')}</div></span></button><button class="quick" data-create><span class="quick-icon">＋</span><span><span class="quick-title">${tr('createCampaign')}</span><div class="quick-sub">${tr('creatorNote')}</div></span></button></section><div class="section-head"><h2 class="section-title">${tr('recentTasks')}</h2><button class="text-button" data-goto="tasks">${tr('seeAll')} ›</button></div><section class="card-list">${channelGate()||(recent.length?recent.map(taskCard).join(''):empty(tr('emptyTasks'),tr('emptyTasksSub')))}</section>${state.tasksChannelUrl?`<button class="btn btn-secondary" style="width:100%;margin-top:15px" data-open-url="${escapeHtml(state.tasksChannelUrl)}">◉ ${tr('openChannel')}</button>`:''}`;}
 function renderTasks(){const list=state.filter==='all'?state.tasks:state.tasks.filter(t=>t.type===state.filter);return `<h1 class="page-title">${tr('tasksTitle')}</h1><p class="page-sub">${tr('tasksSub')}</p><div class="filters">${['all','join','react','view'].map(k=>`<button class="filter ${state.filter===k?'selected':''}" data-filter="${k}">${tr(k==='join'?'membership':k==='react'?'reaction':k==='view'?'view':'all')}</button>`).join('')}</div><div class="card-list">${channelGate()||(list.length?list.map(taskCard).join(''):empty(tr('emptyTasks'),tr('emptyTasksSub')))}</div>${state.tasksChannelUrl?`<button class="btn btn-secondary" style="width:100%;margin-top:15px" data-open-url="${escapeHtml(state.tasksChannelUrl)}">◉ ${tr('openChannel')}</button>`:''}`;}
 function renderCampaigns(){return `<h1 class="page-title">${tr('campaignTitle')}</h1><p class="page-sub">${tr('campaignSub')}</p><button class="btn btn-primary" style="width:100%;margin-bottom:16px" data-create>＋ ${tr('createCampaign')}</button><div class="card-list">${state.campaigns.length?state.campaigns.map(campaignCard).join(''):empty(tr('emptyCampaigns'),tr('emptyCampaignsSub'))}</div>`;}
 function renderProfile(){const u=state.user||{};const name=u.name||tr('unknownUser');return `<h1 class="page-title">${tr('profileTitle')}</h1><p class="page-sub">${tr('accountSettings')}</p><section class="profile-card"><div class="profile-avatar">${escapeHtml(name.charAt(0).toUpperCase())}</div><div><div class="profile-name">${escapeHtml(name)}</div><div class="profile-id">${u.username?'@'+escapeHtml(u.username):'ID '+num(u.id)}</div></div></section><section class="item"><div class="setting"><div><div class="setting-label">${tr('language')}</div><div class="setting-help">${tr('languageHelp')}</div></div><select class="select" id="languageSelect"><option value="en" ${state.lang==='en'?'selected':''}>English</option><option value="fa" ${state.lang==='fa'?'selected':''}>فارسی</option></select></div><div class="setting"><div><div class="setting-label">${tr('reminders')}</div><div class="setting-help">${tr('remindersHelp')}</div></div><button id="reminderToggle" class="toggle ${u.remindersOff?'':'on'}" aria-pressed="${!u.remindersOff}"></button></div><div class="setting"><div><div class="setting-label">${tr('balance')}</div><div class="setting-help">${tr('currentPoints')}</div></div><strong>${num(u.points)} ${tr('pointsShort')}</strong></div><div class="setting"><div><div class="setting-label">${tr('referrals')}</div><div class="setting-help">${tr('account')}</div></div><strong>${num(u.referrals)}</strong></div></section>${state.tasksChannelUrl?`<button class="btn btn-secondary" style="width:100%;margin-top:14px" data-open-url="${escapeHtml(state.tasksChannelUrl)}">◉ ${tr('openChannel')}</button>`:''}`;}
 function renderPage(){const content=$('#content');content.innerHTML=state.page==='home'?renderHome():state.page==='tasks'?renderTasks():state.page==='campaigns'?renderCampaigns():renderProfile();bindPageEvents();}
 async function refreshAll(){if(!initData){$('#content').innerHTML=empty(tr('authRequired'),tr('authError'))+'<button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="location.reload()">'+tr('refresh')+'</button>';return;}try{const [d,t,c]=await Promise.all([api('/api/miniapp/dashboard'),api('/api/miniapp/tasks'),api('/api/miniapp/campaigns')]);state.user=d.user;state.stats=d.stats;state.tasksChannelUrl=d.tasksChannelUrl;state.channelRequired=!!t.channelRequired;state.membershipCheckUnavailable=!!t.membershipCheckUnavailable;state.tasks=t.tasks||[];state.campaigns=c.campaigns||[];setLang(state.user.language||'en');$('#headerAvatar').textContent=(state.user.name||'T').charAt(0).toUpperCase();renderPage();}catch(e){$('#content').innerHTML=empty(tr('loadingError'),readableError(e))+'<button id="retry" class="btn btn-primary" style="width:100%;margin-top:14px">'+tr('refresh')+'</button>';$('#retry')?.addEventListener('click',refreshAll);}}
 function openModal(){if(!state.user)return;$('#campaignModal').classList.add('show');updateCost();}
 function closeModal(){$('#campaignModal').classList.remove('show');}
 function updateCost(){const type=$('#campaignType').value;const cost={join:4,react:3,view:2}[type];$('#estimatedCost').textContent=num(Number($('#campaignQty').value||0)*cost)+' '+tr('pointsShort');$('#windowField').hidden=type!=='react';$('#linkHint').textContent=type==='join'?tr('linkHintJoin'):tr('linkHintPost');$('#campaignLink').placeholder=type==='join'?'https://t.me/channel':'https://t.me/channel/123';}
 async function stopCampaign(id){if(!confirm(tr('confirmStop')))return;try{const r=await api('/api/miniapp/campaigns/'+encodeURIComponent(id)+'/stop',{method:'POST',body:{}});notify(tr('campaignStopped')+' '+num(r.refunded)+' '+tr('pointsShort'));await refreshAll();setPage('campaigns');}catch(e){notify(readableError(e));}}
 async function startTask(id,button){const task=state.tasks.find(x=>x.id===id);if(!task)return;const target=task.targetUrl;if(!target){notify(tr('error'));return;}if(button){button.disabled=true;button.textContent='…';}try{const r=await api('/api/miniapp/tasks/'+encodeURIComponent(id)+'/start',{method:'POST',body:{}});task.started=true;renderPage();notify(tr('missionOpened'));openLink(r.targetUrl||target);}catch(e){notify(readableError(e));if(button){button.disabled=false;button.textContent=tr('startTask');}}}
 async function claimTask(id,button){const task=state.tasks.find(x=>x.id===id);if(button){button.disabled=true;button.textContent='…';}try{const r=await api('/api/miniapp/tasks/'+encodeURIComponent(id)+'/claim',{method:'POST',body:{}});if(r.status==='pending'){if(task)task.completionStatus='count_pending';renderPage();notify(tr('pendingVerification'));return;}notify(tr('verifySuccess')+num(r.reward)+' '+tr('pointsShort'));if(r.user){state.user=r.user;state.stats=r.stats||state.stats;}await refreshAll();setPage('tasks');}catch(e){notify(readableError(e));if(button){button.disabled=false;button.textContent=tr('verifyTask');}}}
 function bindPageEvents(){ $$('[data-goto]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.goto)));$$('[data-create]').forEach(b=>b.addEventListener('click',openModal));$$('[data-open-url]').forEach(b=>b.addEventListener('click',()=>openLink(b.dataset.openUrl)));$$('[data-start-task]').forEach(b=>b.addEventListener('click',()=>startTask(b.dataset.startTask,b)));$$('[data-claim-task]').forEach(b=>b.addEventListener('click',()=>claimTask(b.dataset.claimTask,b)));$$('[data-stop-campaign]').forEach(b=>b.addEventListener('click',()=>stopCampaign(b.dataset.stopCampaign)));$$('[data-filter]').forEach(b=>b.addEventListener('click',()=>{state.filter=b.dataset.filter;renderPage();}));$('#languageSelect')?.addEventListener('change',async e=>{const old=state.lang;try{const d=await api('/api/miniapp/profile',{method:'PATCH',body:{language:e.target.value}});state.user=d.user;state.stats=d.stats;setLang(state.user.language);renderPage();notify(tr('languageSaved'));}catch(err){setLang(old);notify(readableError(err));renderPage();}});$('#reminderToggle')?.addEventListener('click',async()=>{const off=!state.user.remindersOff;try{const d=await api('/api/miniapp/profile',{method:'PATCH',body:{remindersOff:off}});state.user=d.user;state.stats=d.stats;renderPage();notify(tr('remindersSaved'));}catch(e){notify(readableError(e));}});}
 $('#closeModal').addEventListener('click',closeModal);$('#campaignModal').addEventListener('click',e=>{if(e.target===$('#campaignModal'))closeModal()});$('#campaignType').addEventListener('change',updateCost);$('#campaignQty').addEventListener('input',updateCost);$('#createForm').addEventListener('submit',async e=>{e.preventDefault();const type=$('#campaignType').value,link=$('#campaignLink').value.trim(),quantity=Number($('#campaignQty').value),windowMin=Number($('#reactionWindow').value);if(!link){notify(tr('chooseLink'));return;}if(!Number.isInteger(quantity)||quantity<1){notify(tr('qtyError'));return;}const btn=$('#submitCampaign');btn.disabled=true;btn.textContent=tr('creating');try{await api('/api/miniapp/campaigns',{method:'POST',body:{type,link,quantity,windowMin}});closeModal();$('#campaignLink').value='';notify(tr('campaignPublished'));await refreshAll();setPage('campaigns');}catch(err){notify(readableError(err));if(err.code==='baseline_pending'){} }finally{btn.disabled=false;btn.textContent=tr('publishCampaign');}});
 $$('.nav-btn').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));$('#headerAvatar').addEventListener('click',()=>setPage('profile'));if(tg?.onEvent)tg.onEvent('viewportChanged',()=>tg.expand());document.addEventListener('visibilitychange',()=>{if(!document.hidden&&initData)refreshAll();});window.addEventListener('focus',()=>{if(initData)refreshAll();});refreshAll();
})();
</script>
