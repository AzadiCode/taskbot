<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">TP</div><div><div class="brandname">TaskPlus</div><div class="eyebrow" data-i18n="community">TASK EXCHANGE</div></div></div>
    <button class="avatar" id="headerAvatar" aria-label="Profile">T</button>
  </header>
  <main id="content"><div class="loader"></div></main>
</div>
<div class="bottom"><nav class="nav" aria-label="Main navigation">
  <button class="nav-btn active" data-page="home"><span class="nav-icon">⌂</span><span data-i18n="home">Home</span></button>
  <button class="nav-btn" data-page="tasks"><span class="nav-icon">✦</span><span data-i18n="tasks">Tasks</span></button>
  <button class="nav-btn" data-page="campaigns"><span class="nav-icon">▤</span><span data-i18n="campaigns">Campaigns</span></button>
  <button class="nav-btn" data-page="profile"><span class="nav-icon">◉</span><span data-i18n="profile">Profile</span></button>
</nav></div>
<div id="toast" class="toast" role="status"></div>
<div class="modal-backdrop" id="campaignModal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-header"><div class="modal-title" id="modalTitle" data-i18n="createCampaign">Create campaign</div><button class="close" id="closeModal" aria-label="Close">×</button></div>
  <form id="createForm">
    <div class="field"><label for="campaignType" data-i18n="taskType">Task type</label><select id="campaignType"><option value="join" data-i18n="membership">Membership</option><option value="react" data-i18n="reaction">Reaction</option><option value="view" data-i18n="view">View</option></select></div>
    <div class="field"><label for="campaignLink" data-i18n="destinationLink">Destination link</label><input id="campaignLink" type="url" placeholder="https://t.me/channel or post link" required maxlength="2048"><div class="hint" id="linkHint" data-i18n="linkHintJoin">For membership, use the channel link. The bot must be an administrator there.</div></div>
    <div class="field"><label for="campaignQty" data-i18n="quantity">Quantity</label><input id="campaignQty" type="number" value="10" min="1" step="1" required inputmode="numeric"><div class="hint" data-i18n="quantityHint">The maximum depends on your available points.</div></div>
    <div class="field" id="windowField" hidden><label for="reactionWindow" data-i18n="reactionWindow">Reaction window</label><select id="reactionWindow"><option value="2">2 minutes</option><option value="5" selected>5 minutes</option></select><div class="hint" data-i18n="windowHint">Used for channel reaction count verification.</div></div>
    <div class="cost-box"><span data-i18n="estimatedCost">Estimated cost</span><strong id="estimatedCost">40 pts</strong></div>
    <button class="btn btn-primary" id="submitCampaign" type="submit" data-i18n="publishCampaign">Publish campaign</button>
  </form>
</section></div>

 const tr=(k)=>words[state.lang]?.[k]||words.en[k]||k;

بتواند آن را بررسی کند.',admin_check_unavailable:'بررسی دسترسی ربات ناموفق بود؛ کمی بعد دوباره تلاش کن.',insufficient_points:'موجودی تغییر کرده یا کافی نیست؛ اطلاعات را تازه‌سازی کن.',publish_failed:'انتشار کمپین انجام نشد و امتیاز استفاده‌نشده برگشت.',invalid_id:'شناسه کمپین معتبر نیست.',not_active:'این کمپین دیگر فعال نیست.',language:'زبان انگلیسی یا فارسی را انتخاب کن.',empty:'تغییری برای ذخیره ارسال نشده است.'}};
 function readableError(e){return apiErrors[state.lang]?.[e?.code]||e?.message||tr('error');}
 const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const num=n=>new Intl.NumberFormat('en-US').format(Number(n||0));
 const iconFor=t=>t==='join'?'↗':t==='react'?'♥':'◉';
 const initData=tg?.initData||'';
 function notify(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.remove('show'),3200);}
 async function api(path,options={}){const headers={'Content-Type':'application/json','X-Telegram-Init-Data':initData,...(options.headers||{})};const res=await fetch(path,{...options,headers,body:options.body?JSON.stringify(options.body):undefined});let data={};try{data=await res.json()}catch{}if(!res.ok){const e=new Error(data.message||tr('networkError'));e.status=res.status;e.code=data.error;throw e}return data;}
 function setLang(lang){state.lang=lang==='fa'?'fa':'en';document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='fa'?'rtl':'ltr';$$('[data-i18n]').forEach(el=>{el.textContent=tr(el.dataset.i18n)});}
 function setPage(page){state.page=page;$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));renderPage();}
 function openLink(url){if(!url)return;if(tg?.openTelegramLink&&url.startsWith('https://t.me/'))tg.openTelegramLink(url);else if(tg?.openLink)tg.openLink(url);else window.open(url,'_blank','noopener');}
 function empty(title,sub){return `<div class="empty"><strong>${escapeHtml(title)}</strong>${escapeHtml(sub||'')}</div>`;}
 function taskCard(t){return `<article class="item"><div class="item-top"><div class="item-icon">${iconFor(t.type)}</div><div class="item-main"><div class="item-title">${escapeHtml(t.title)}</div><div class="item-meta"><span class="tag">${escapeHtml(t.typeLabel||tr(t.type))}</span><span class="tag cyan">${num(t.remaining)} ${tr('left')}</span></div></div><div class="reward">+${num(t.reward)} ${tr('pointsShort')}</div></div><div class="item-actions"><button class="btn btn-primary" data-start-task="${escapeHtml(t.id)}">↗ ${tr('startTask')}</button>${t.postUrl?`<button class="btn btn-secondary" data-open-url="${escapeHtml(t.postUrl)}">${tr('viewPost')}</button>`:''}</div></article>`;}
 function campaignCard(c){const st=c.status==='active'?'active':c.status==='paused'?'paused':'';const statusLabel=c.status==='active'?tr('activeStatus'):c.status==='paused'?tr('pausedStatus'):c.status==='cancelled'?tr('cancelledStatus'):tr('completeStatus');return `<article class="item"><div class="item-top"><div class="item-icon">${iconFor(c.type)}</div><div class="item-main"><div class="item-title">${escapeHtml(c.title)}</div><div class="item-meta"><span class="tag">${escapeHtml(c.typeLabel||tr(c.type))}</span><span class="status ${st}">${statusLabel}</span></div></div><div class="reward">${num(c.status==='active'?c.remaining*c.cost:0)} ${tr('pointsShort')}</div></div><div class="progress"><span style="width:${Math.max(0,Math.min(100,c.progress||0))}%"></span></div><div class="progress-row"><span>${tr('progress')} · ${num(c.done)}/${num(c.target)}</span><span>${num(c.progress)}%</span></div>${c.canStop?`<div class="item-actions"><button class="btn btn-danger" data-stop-campaign="${escapeHtml(c.id)}">${tr('stop')}</button>${c.postUrl?`<button class="btn btn-secondary" data-open-url="${escapeHtml(c.postUrl)}">${tr('viewPost')}</button>`:''}</div>`:''}</article>`;}
 function channelGate(){if(state.channelRequired)return `${empty(tr('joinChannelRequired'),tr('joinChannelMessage'))}${state.tasksChannelUrl?`<button class="btn btn-primary" style="width:100%;margin-top:10px" data-open-url="${escapeHtml(state.tasksChannelUrl)}">◉ ${tr('joinTaskChannel')}</button>`:''}`;if(state.membershipCheckUnavailable)return empty(tr('membershipCheckUnavailable'),tr('membershipCheckMessage'));return '';}
 function renderHome(){const u=state.user||{},s=state.stats||{};const recent=state.tasks.slice(0,3);return `<p class="hello">${tr('hello')}${u.name?`, ${escapeHtml(u.name)}`:''}</p><h1 class="hero-title">${tr('growth')}<br><span class="accent">${tr('workspace')}</span></h1><section class="balance"><div class="balance-head"><span>✦ ${tr('balance')}</span><span class="pill"><i class="dot"></i> TaskPlus</span></div><div class="balance-amount">${num(u.points)} <small>${tr('pointsShort')}</small></div><div class="balance-sub">${tr('hold')}: ${num(u.hold)} · ${tr('earned')}: ${num(u.earned)}</div><div class="balance-actions"><button class="btn btn-primary btn-wide" data-goto="tasks">✦ ${tr('startTasks')}</button><button class="btn btn-secondary" data-create>${tr('createNew')} +</button></div></section><section class="stats"><div class="stat"><div class="stat-icon">✦</div><div class="stat-num">${num(s.availableTasks)}</div><div class="stat-label">${tr('available')}</div></div><div class="stat"><div class="stat-icon">▤</div><div class="stat-num">${num(s.activeCampaigns)}</div><div class="stat-label">${tr('active')}</div></div><div class="stat"><div class="stat-icon">✓</div><div class="stat-num">${num(s.completedTasks)}</div><div class="stat-label">${tr('completed')}</div></div></section><div class="section-head"><h2 class="section-title">${tr('quickActions')}</h2></div><section class="quick-grid"><button class="quick" data-goto="tasks"><span class="quick-icon">✦</span><span><span class="quick-title">${tr('startTasks')}</span><div class="quick-sub">${tr('taskOpenInfo')}</div></span></button><button class="quick" data-create><span class="quick-icon">＋</span><span><span class="quick-title">${tr('createCampaign')}</span><div class="quick-sub">${tr('creatorNote')}</div></span></button></section><div class="section-head"><h2 class="section-title">${tr('recentTasks')}</h2><button class="text-button" data-goto="tasks">${tr('seeAll')} ›</button></div><section class="card-list">${channelGate()||(recent.length?recent.map(taskCard).join(''):empty(tr('emptyTasks'),tr('emptyTasksSub')))}</section>${state.tasksChannelUrl?`<button class="btn btn-secondary" style="width:100%;margin-top:14px" data-open-url="${escapeHtml(state.tasksChannelUrl)}">◉ ${tr('openChannel')}</button>`:''}`;}
 function renderTasks(){const list=state.filter==='all'?state.tasks:state.tasks.filter(t=>t.type===state.filter);return `<h1 class="page-title">${tr('tasksTitle')}</h1><p class="page-sub">${tr('tasksSub')}</p><div class="filters">${['all','join','react','view'].map(k=>`<button class="filter ${state.filter===k?'selected':''}" data-filter="${k}">${tr(k==='join'?'membership':k==='react'?'reaction':k==='view'?'view':'all')}</button>`).join('')}</div><div class="card-list">${channelGate()||(list.length?list.map(taskCard).join(''):empty(tr('emptyTasks'),tr('emptyTasksSub')))}</div>${state.tasksChannelUrl?`<button class="btn btn-secondary" style="width:100%;margin-top:15px" data-open-url="${escapeHtml(state.tasksChannelUrl)}">◉ ${tr('openChannel')}</button>`:''}`;}
 function renderCampaigns(){return `<h1 class="page-title">${tr('campaignTitle')}</h1><p class="page-sub">${tr('campaignSub')}</p><button class="btn btn-primary" style="width:100%;margin-bottom:16px" data-create>＋ ${tr('createCampaign')}</button><div class="card-list">${state.campaigns.length?state.campaigns.map(campaignCard).join(''):empty(tr('emptyCampaigns'),tr('emptyCampaignsSub'))}</div>`;}
 function renderProfile(){const u=state.user||{};const name=u.name||tr('unknownUser');return `<h1 class="page-title">${tr('profileTitle')}</h1><p class="page-sub">${tr('accountSettings')}</p><section class="profile-card"><div class="profile-avatar">${escapeHtml(name.charAt(0).toUpperCase())}</div><div><div class="profile-name">${escapeHtml(name)}</div><div class="profile-id">${u.username?'@'+escapeHtml(u.username):'ID '+num(u.id)}</div></div></section><section class="item"><div class="setting"><div><div class="setting-label">${tr('language')}</div><div class="setting-help">${tr('languageHelp')}</div></div><select class="select" id="languageSelect"><option value="en" ${state.lang==='en'?'selected':''}>English</option><option value="fa" ${state.lang==='fa'?'selected':''}>فارسی</option></select></div><div class="setting"><div><div class="setting-label">${tr('reminders')}</div><div class="setting-help">${tr('remindersHelp')}</div></div><button id="reminderToggle" class="toggle ${u.remindersOff?'':'on'}" aria-pressed="${!u.remindersOff}"></button></div><div class="setting"><div><div class="setting-label">${tr('balance')}</div><div class="setting-help">${tr('currentPoints')}</div></div><strong>${num(u.points)} ${tr('pointsShort')}</strong></div><div class="setting"><div><div class="setting-label">${tr('referrals')}</div><div class="setting-help">${tr('account')}</div></div><strong>${num(u.referrals)}</strong></div></section>${state.tasksChannelUrl?`<button class="btn btn-secondary" style="width:100%;margin-top:14px" data-open-url="${escapeHtml(state.tasksChannelUrl)}">◉ ${tr('openChannel')}</button>`:''}`;}
 function renderPage(){const content=$('#content');content.innerHTML=state.page==='home'?renderHome():state.page==='tasks'?renderTasks():state.page==='campaigns'?renderCampaigns():renderProfile();bindPageEvents();}
 async function refreshAll(){if(!initData){$('#content').innerHTML=empty(tr('authRequired'),tr('authError'))+'<button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="location.reload()">'+tr('refresh')+'</button>';return;}try{const [d,t,c]=await Promise.all([api('/api/miniapp/dashboard'),api('/api/miniapp/tasks'),api('/api/miniapp/campaigns')]);state.user=d.user;state.stats=d.stats;state.tasksChannelUrl=d.tasksChannelUrl;state.channelRequired=!!t.channelRequired;state.membershipCheckUnavailable=!!t.membershipCheckUnavailable;state.tasks=t.tasks||[];state.campaigns=c.campaigns||[];setLang(state.user.language||'en');$('#headerAvatar').textContent=(state.user.name||'T').charAt(0).toUpperCase();renderPage();}catch(e){$('#content').innerHTML=empty(tr('loadingError'),readableError(e))+'<button id="retry" class="btn btn-primary" style="width:100%;margin-top:14px">'+tr('refresh')+'</button>';$('#retry')?.addEventListener('click',refreshAll);}}
 function openModal(){if(!state.user)return;$('#campaignModal').classList.add('show');updateCost();}
 function closeModal(){$('#campaignModal').classList.remove('show');}
 function updateCost(){const type=$('#campaignType').value;const cost={join:4,react:3,view:2}[type];$('#estimatedCost').textContent=num(Number($('#campaignQty').value||0)*cost)+' '+tr('pointsShort');$('#windowField').hidden=type!=='react';$('#linkHint').textContent=type==='join'?tr('linkHintJoin'):tr('linkHintPost');$('#campaignLink').placeholder=type==='join'?'https://t.me/channel':'https://t.me/channel/123';}
 async function stopCampaign(id){if(!confirm(tr('confirmStop')))return;try{const r=await api('/api/miniapp/campaigns/'+encodeURIComponent(id)+'/stop',{method:'POST',body:{}});notify(tr('campaignStopped')+' '+num(r.refunded)+' '+tr('pointsShort'));await refreshAll();setPage('campaigns');}catch(e){notify(readableError(e));}}
 function bindPageEvents(){ $$('[data-goto]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.goto)));$$('[data-create]').forEach(b=>b.addEventListener('click',openModal));$$('[data-open-url]').forEach(b=>b.addEventListener('click',()=>openLink(b.dataset.openUrl)));$$('[data-start-task]').forEach(b=>b.addEventListener('click',()=>{const t=state.tasks.find(x=>x.id===b.dataset.startTask);if(t?.taskUrl)openLink(t.taskUrl);else notify(tr('error'));}));$$('[data-stop-campaign]').forEach(b=>b.addEventListener('click',()=>stopCampaign(b.dataset.stopCampaign)));$$('[data-filter]').forEach(b=>b.addEventListener('click',()=>{state.filter=b.dataset.filter;renderPage();}));$('#languageSelect')?.addEventListener('change',async e=>{const old=state.lang;try{const d=await api('/api/miniapp/profile',{method:'PATCH',body:{language:e.target.value}});state.user=d.user;state.stats=d.stats;setLang(state.user.language);renderPage();notify(tr('languageSaved'));}catch(err){setLang(old);notify(readableError(err));renderPage();}});$('#reminderToggle')?.addEventListener('click',async()=>{const off=!state.user.remindersOff;try{const d=await api('/api/miniapp/profile',{method:'PATCH',body:{remindersOff:off}});state.user=d.user;state.stats=d.stats;renderPage();notify(tr('remindersSaved'));}catch(e){notify(readableError(e));}});}
 $('#closeModal').addEventListener('click',closeModal);$('#campaignModal').addEventListener('click',e=>{if(e.target===$('#campaignModal'))closeModal()});$('#campaignType').addEventListener('change',updateCost);$('#campaignQty').addEventListener('input',updateCost);$('#createForm').addEventListener('submit',async e=>{e.preventDefault();const type=$('#campaignType').value,link=$('#campaignLink').value.trim(),quantity=Number($('#campaignQty').value),windowMin=Number($('#reactionWindow').value);if(!link){notify(tr('chooseLink'));return;}if(!Number.isInteger(quantity)||quantity<1){notify(tr('qtyError'));return;}const btn=$('#submitCampaign');btn.disabled=true;btn.textContent=tr('creating');try{await api('/api/miniapp/campaigns',{method:'POST',body:{type,link,quantity,windowMin}});closeModal();$('#campaignLink').value='';notify(tr('campaignPublished'));await refreshAll();setPage('campaigns');}catch(err){notify(readableError(err));if(err.code==='baseline_pending'){} }finally{btn.disabled=false;btn.textContent=tr('publishCampaign');}});
 $$('.nav-btn').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));$('#headerAvatar').addEventListener('click',()=>setPage('profile'));if(tg?.onEvent)tg.onEvent('viewportChanged',()=>tg.expand());refreshAll();
})();
</script>
