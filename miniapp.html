<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1024">
<title>Grameeting</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{
  color-scheme:dark;
  --ink:#0c1024;--panel:#151a38;--panel-2:#1c2248;--raise:#252c5c;
  --line:rgba(158,172,255,.13);--line-2:rgba(158,172,255,.26);
  --text:#f2f4ff;--muted:#98a1cb;--faint:#6d77a6;
  --brand:#7b8cff;--on-brand:#0c1024;
  --gold:#ffc759;--gold-soft:rgba(255,199,89,.14);
  --mint:#3ee0b0;--mint-soft:rgba(62,224,176,.14);
  --rose:#ff7a90;--pink:#ff6fc8;--cyan:#4fd6ff;
  --lv:#2aabee;
  --nav-h:68px;
  --font:"Vazirmatn",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--lv) 16%,transparent),transparent 62%),var(--ink);padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:10px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}
svg.i.fill{fill:currentColor;stroke:none}
[dir=rtl] .flip{transform:scaleX(-1)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ---------- shell ---------- */
.app{width:min(100%,560px);margin:0 auto;padding:0 16px}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--ink) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar-id{display:flex;align-items:center;gap:10px;min-width:0}
.bar-name{font-weight:700;font-size:15px;line-height:1.2}
.bar-sub{font-size:11px;color:var(--muted);line-height:1.3}
.bal{display:flex;align-items:center;gap:7px;padding:7px 13px 7px 11px;border-radius:999px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 34%,transparent);color:var(--gold);font-weight:800;font-size:16px}
[dir=rtl] .bal{padding:7px 11px 7px 13px}
.bal.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.14)}}
main{padding-top:6px}
.page-title{font-size:22px;font-weight:800;margin:10px 0 2px;letter-spacing:-.2px}
.page-sub{color:var(--muted);font-size:13px;margin:0 0 14px;max-width:46ch}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.sec h2{font-size:15px;font-weight:800;margin:0}
.link-btn{color:var(--brand);font-weight:700;font-size:12px;display:inline-flex;align-items:center;gap:3px}

/* ---------- surfaces ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}
.card+.card{margin-top:10px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.mint{background:var(--mint-soft);color:var(--mint)}
.chip.brand{background:rgba(123,140,255,.16);color:var(--brand)}
.chip.rose{background:rgba(255,122,144,.14);color:var(--rose)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:14px;font-weight:800;font-size:14px;transition:transform .12s ease,opacity .2s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.gold{background:var(--gold);color:#2b1d00}
.btn.ghost{background:var(--panel-2);border:1px solid var(--line-2)}
.btn.block{width:100%}
.btn.icon{flex:0 0 48px;padding:0}
.t-act .btn.icon{flex:0 0 48px}
.btn.sm{min-height:38px;padding:0 14px;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.45}

.seg{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.seg button{flex:1;min-height:36px;padding:0 8px;border-radius:10px;color:var(--muted);font-weight:700;font-size:12.5px;white-space:nowrap}
.seg button.on{background:var(--raise);color:var(--text)}

.bar-track{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--brand);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar-fill.gold{background:var(--gold)}
.bar-fill.mint{background:var(--mint)}

.empty{padding:34px 18px;text-align:center;border:1px dashed var(--line-2);border-radius:20px;color:var(--muted)}
.empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.loader{width:30px;height:30px;margin:90px auto;border-radius:50%;border:3px solid var(--panel-2);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- orbit (home hero) ---------- */
.orbit-card{position:relative;overflow:hidden;padding:20px 18px 18px;border-radius:26px;background:var(--panel);border:1px solid color-mix(in srgb,var(--lv) 30%,var(--line))}
.orbit-wrap{position:relative;width:208px;height:208px;margin:0 auto 6px}
.orbit-wrap svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .trk{fill:none;stroke:rgba(158,172,255,.2);stroke-width:7}
.ring .arc{fill:none;stroke:var(--lv);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--lv) 70%,transparent))}
.ring .sat{fill:#fff;filter:drop-shadow(0 0 7px var(--lv));transition:transform 1.4s cubic-bezier(.2,.8,.2,1);transform-origin:104px 104px}
.orbit-core{position:absolute;inset:24px;display:grid;place-items:center}
.orbit-core .emb{width:100%;height:100%}
.orbit-lvl{position:absolute;inset-inline:0;bottom:-2px;text-align:center}
.orbit-lvl span{display:inline-block;padding:2px 12px;border-radius:99px;background:var(--ink);border:1px solid color-mix(in srgb,var(--lv) 55%,transparent);color:var(--lv);font-weight:800;font-size:12px}
.orbit-title{text-align:center;font-size:20px;font-weight:800;margin:16px 0 8px}
.orbit-sub{display:flex;justify-content:center;min-height:26px;margin:0 auto 14px}
.emb{display:block;overflow:visible;filter:drop-shadow(0 0 9px color-mix(in srgb,var(--c,var(--lv)) 55%,transparent))}

/* member-crowd badge motion */
.emb .p{transform-box:fill-box;transform-origin:50% 100%}
.emb.live .p{animation:popin .65s cubic-bezier(.2,1.5,.4,1) backwards,bob 3.2s ease-in-out infinite;animation-delay:var(--d),calc(var(--d) + .65s)}
.emb .pulse{opacity:0;transform-box:fill-box;transform-origin:center}
.emb.live .pulse{animation:pulse 2.8s ease-out infinite}
.emb .crown{transform-box:fill-box;transform-origin:50% 100%}
.emb.live .crown{animation:tw 2.2s ease-in-out infinite}
@keyframes popin{from{transform:scale(0);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.8px)}}
@keyframes pulse{0%{transform:scale(.94);opacity:.55}100%{transform:scale(1.22);opacity:0}}
@keyframes tw{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.12);filter:brightness(1.35)}}

/* ---------- home blocks ---------- */
.gold-banner{display:flex;align-items:center;gap:10px;margin-top:12px;padding:11px 14px;border-radius:16px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 38%,transparent);color:var(--gold);font-weight:700;font-size:13px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.duo .card+.card{margin-top:0}
.mini-k{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.mini-v{font-size:26px;font-weight:800;line-height:1.1}
.mini-v small{font-size:13px;color:var(--muted);font-weight:600}
.streak{display:flex;gap:5px;margin-top:10px}
.streak i{flex:1;height:6px;border-radius:9px;background:var(--panel-2)}
.streak i.on{background:var(--gold)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{padding:12px 10px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
.stat b{display:block;font-size:20px;font-weight:800}
.stat span{font-size:11px;color:var(--muted)}
.next-lock{display:flex;align-items:center;gap:12px;margin-top:10px;padding:13px 14px;background:var(--panel);border:1px dashed var(--line-2);border-radius:18px}
.next-lock .emb{width:40px;height:40px;opacity:.55}
.next-lock b{display:block;font-size:13.5px}
.next-lock span{font-size:12px;color:var(--muted)}

/* ---------- tasks ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;padding:8px 15px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-weight:700;font-size:12.5px}
.filters button.on{background:var(--raise);border-color:var(--line-2);color:var(--text)}
.day-line{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;font-size:12.5px}
.day-line .bar-track{flex:1}
.task{padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:20px}
.task+.task{margin-top:10px}
.task.live{border-color:color-mix(in srgb,var(--brand) 50%,transparent)}
.t-top{display:flex;gap:12px;align-items:flex-start}
.t-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:rgba(123,140,255,.16);color:var(--brand)}
.t-ico.react{background:rgba(255,111,200,.14);color:var(--pink)}
.t-ico.view{background:var(--mint-soft);color:var(--mint)}
.t-title{font-weight:800;font-size:14.5px;line-height:1.4;overflow-wrap:anywhere}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.t-reward{margin-inline-start:auto;flex:none;text-align:center;color:var(--gold);font-weight:800;font-size:17px;line-height:1.1}
.t-reward small{display:block;font-size:10px;color:var(--muted);font-weight:600}
.t-act{display:flex;gap:8px;margin-top:12px}
.t-act .btn{flex:1}

/* ---------- campaigns ---------- */
.fund{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px}
.fund b{font-size:24px;font-weight:800;color:var(--gold)}
.camp{padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:20px}
.camp+.camp{margin-top:10px}
.camp .bar-track{margin:12px 0 8px}
.camp-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* ---------- rewards ---------- */
.lv-path{position:relative}
.lv{display:flex;gap:14px;position:relative;padding-bottom:18px}
.lv:last-child{padding-bottom:0}
.lv:not(:last-child)::before{content:"";position:absolute;inset-inline-start:25px;top:54px;bottom:-2px;width:2px;background:var(--line-2)}
.lv.past:not(:last-child)::before{background:var(--mint)}
.lv .emb{width:52px;height:52px;flex:none}
.lv.future .emb{opacity:.4;filter:grayscale(.6)}
.lv-body{flex:1;min-width:0;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:18px}
.lv.now .lv-body{border-color:color-mix(in srgb,var(--lv) 60%,transparent);background:color-mix(in srgb,var(--lv) 8%,var(--panel))}
.lv-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lv-head b{font-size:15px}
.perks{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:5px;font-size:12.5px;color:var(--muted)}
.perks li{display:flex;gap:7px;align-items:flex-start}
.perks li svg{margin-top:3px;color:var(--mint)}
.perks li.soon svg{color:var(--faint)}
.perks li.soon{color:var(--faint)}
.perks.fut li svg{color:var(--faint)}
.gift-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}
.gd{padding:8px 0 7px;border-radius:12px;background:var(--panel-2);text-align:center;border:1px solid transparent}
.gd small{display:block;font-size:10px;color:var(--faint)}
.gd b{font-size:15px}
.gd.done{background:var(--gold-soft);color:var(--gold)}
.gd.today{border-color:var(--gold)}
.gd.today b{color:var(--gold)}
.wheel-box{position:relative;width:min(280px,76vw);margin:6px auto 16px}
.wheel-box svg{width:100%;display:block}
.wheel-rot{transform-origin:150px 150px;transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
.wheel-pin{position:absolute;top:-6px;inset-inline:0;margin:auto;width:26px;height:30px;color:var(--gold);filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ach{padding:12px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.ach.have{border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.ach-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.ach-ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--panel-2);color:var(--faint)}
.ach.have .ach-ico{background:var(--gold-soft);color:var(--gold)}
.ach b{font-size:12.5px;line-height:1.35;display:block}
.ach .meta{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted)}
.ach-group{margin:18px 0 8px;font-size:12.5px;color:var(--muted);font-weight:700}
.prizes{display:flex;gap:8px;margin:12px 0}
.prize{flex:1;padding:10px 6px;text-align:center;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.prize b{display:block;color:var(--gold);font-size:17px}
.prize span{font-size:11px;color:var(--muted)}
.rank-row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--panel);border:1px solid var(--line);border-radius:15px}
.rank-row+.rank-row{margin-top:6px}
.rank-row.me{border-color:var(--brand);background:rgba(123,140,255,.1)}
.rk{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--panel-2);flex:none}
.rk.r1{background:var(--gold);color:#2b1d00}.rk.r2{background:#c7cde8;color:#1b2140}.rk.r3{background:#d58f5c;color:#2a1405}
.rank-row .sc{margin-inline-start:auto;font-weight:800;color:var(--gold)}

/* ---------- profile ---------- */
.me-card{display:flex;align-items:center;gap:14px}
.me-name{font-size:18px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.invite-link{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:var(--ink);border:1px solid var(--line);direction:ltr;font-size:12px;color:var(--muted);overflow:hidden}
.invite-link span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.ladder div{padding:9px 4px;text-align:center;border-radius:12px;background:var(--panel-2);font-size:11px;color:var(--muted)}
.ladder b{display:block;font-size:15px;color:var(--text)}
.ladder .have{background:var(--mint-soft);color:var(--mint)}.ladder .have b{color:var(--mint)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.set-row+.set-row{border-top:1px solid var(--line)}
.toggle{position:relative;width:46px;height:28px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line-2);flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.toggle.on{background:var(--mint)}
.toggle.on::after{inset-inline-start:21px}

/* avatar */
.av{position:relative;width:42px;height:42px;flex:none}
.av.lg{width:72px;height:72px}
.av-in{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:color-mix(in srgb,var(--lv) 16%,var(--panel-2));border:2px solid var(--lv);color:var(--lv)}
.av-in svg.i{width:46%;height:46%}
.av-in img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av-lv{position:absolute;inset-inline-end:-5px;bottom:-5px;width:46%;height:46%;border-radius:50%;background:var(--ink)}
.av-lv .emb{width:100%;height:100%;filter:none}

/* task flow */
.tk-head{display:flex;gap:12px;align-items:flex-start;padding-bottom:4px}
.steps{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:12px;position:relative}
.steps li{display:flex;gap:12px;align-items:flex-start;color:var(--faint)}
.steps li i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;background:var(--panel-2);border:1px solid var(--line-2)}
.steps li b{display:block;font-size:14px;line-height:1.5;padding-top:3px}
.steps li>div>span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.steps li.cur{color:var(--text)}
.steps li.cur i{background:var(--brand);color:var(--on-brand);border-color:transparent}
.steps li.done{color:var(--muted)}
.steps li.done i{background:var(--mint-soft);color:var(--mint);border-color:transparent}
.tk-timer{display:flex;align-items:center;gap:8px;margin-top:14px;padding:10px 14px;border-radius:14px;background:var(--gold-soft);color:var(--gold);font-weight:800;font-size:13.5px}
.tk-msg{display:flex;gap:9px;align-items:flex-start;margin-top:14px;padding:11px 14px;border-radius:14px;font-size:13px;line-height:1.6}
.tk-msg.err{background:rgba(255,122,144,.12);color:var(--rose)}
.tk-msg.info{background:rgba(123,140,255,.12);color:var(--brand)}
.tk-msg.ok{background:var(--mint-soft);color:var(--mint)}
.tk-msg svg{margin-top:3px}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:spin .8s linear infinite;flex:none}
.task[data-act]{cursor:pointer}

/* invite banner */
.banner{border-radius:20px;overflow:hidden;background:var(--panel-2);border:1px solid var(--line-2)}
.ban-img{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;background:var(--ink)}
.ban-art{display:grid;width:100%;aspect-ratio:16/9}
.ban-art{display:grid;place-items:center;background:radial-gradient(70% 90% at 50% 40%,color-mix(in srgb,var(--lv) 28%,transparent),transparent 70%),var(--panel-2)}
.ban-art .emb{width:34%;max-width:130px;height:auto}
.ban-body{display:grid;gap:4px;padding:14px}
.ban-body b{font-size:16px}
.ban-body>span{font-size:13px;color:var(--muted);line-height:1.7}
.ban-link{display:flex;align-items:center;gap:7px;margin-top:8px;padding:8px 11px;border-radius:11px;background:var(--ink);direction:ltr;font-size:11.5px;color:var(--brand);overflow:hidden}
.ban-link span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.invite .t-act{margin-top:12px}
.inv-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.inv-stats div{padding:10px 6px;text-align:center;border-radius:14px;background:var(--panel-2)}
.inv-stats b{display:block;font-size:18px}
.inv-stats span{font-size:11px;color:var(--muted)}
.up-row{display:flex;gap:12px;align-items:center}
.up-thumb{width:96px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--panel-2);border:1px dashed var(--line-2);display:grid;place-items:center;color:var(--faint);flex:none}
.up-thumb img{width:100%;height:100%;object-fit:cover}
.ta{padding:12px 14px;min-height:96px;resize:vertical;line-height:1.7}

/* ---------- nav ---------- */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:30;padding:0 10px calc(8px + env(safe-area-inset-bottom));pointer-events:none}
.nav-in{pointer-events:auto;width:min(100%,540px);margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line-2);border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:18px;color:var(--faint);font-size:10.5px;font-weight:700}
.nav button.on{background:var(--raise);color:var(--text)}
.nav button.on svg{color:var(--lv)}
.nav .dot{position:absolute;top:8px;inset-inline-end:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px var(--panel)}

/* ---------- sheets, toast, celebrate ---------- */
.veil{position:fixed;inset:0;z-index:50;background:rgba(5,7,20,.66);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
.veil.show{display:flex}
.sheet{width:min(100%,560px);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:28px 28px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-h b{font-size:18px}
.x{width:36px;height:36px;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;color:var(--muted)}
.types{display:grid;gap:8px}
.type-opt{display:flex;align-items:center;gap:12px;padding:12px;text-align:start;border-radius:16px;background:var(--panel-2);border:1.5px solid transparent}
.type-opt.on{border-color:var(--brand);background:rgba(123,140,255,.1)}
.type-opt b{display:block;font-size:14px}
.type-opt span{font-size:12px;color:var(--muted)}
.type-opt .chip{font-size:11px}
.field{margin-top:14px}
.field label{display:block;font-weight:700;font-size:12.5px;margin-bottom:6px;color:var(--muted)}
.inp{width:100%;min-height:48px;padding:0 14px;border-radius:14px;background:var(--ink);border:1px solid var(--line-2);font-size:15px}
.inp:focus{outline:none;border-color:var(--brand)}
.hint{font-size:12px;color:var(--faint);margin-top:6px}
.quick{display:flex;gap:8px;margin-top:8px}
.quick button{flex:1;min-height:36px;border-radius:11px;background:var(--panel-2);font-weight:700;font-size:12.5px;color:var(--muted)}
.sum{margin-top:16px;padding:13px 14px;border-radius:16px;background:var(--panel-2);display:grid;gap:6px;font-size:13px}
.sum div{display:flex;justify-content:space-between}
.sum b{color:var(--gold)}
.toast{position:fixed;inset-inline:16px;bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom));z-index:60;margin:0 auto;width:fit-content;max-width:min(92vw,460px);padding:11px 16px;border-radius:14px;background:var(--raise);border:1px solid var(--line-2);font-weight:700;font-size:13px;text-align:center;opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:none}
.cele{align-items:center;padding:20px}
.cele-box{width:min(100%,340px);padding:30px 22px 22px;text-align:center;border-radius:28px;background:var(--panel);border:1px solid color-mix(in srgb,var(--c,var(--gold)) 50%,transparent);animation:pop .5s cubic-bezier(.2,1.3,.3,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.cele-box .emb{width:108px;height:108px;margin:0 auto 10px}
.cele-star svg{width:44px;height:44px}
.cele-k{color:var(--muted);font-size:13px}
.cele-v{direction:ltr;unicode-bidi:isolate;font-size:44px;font-weight:800;color:var(--c,var(--gold));line-height:1.2;margin:2px 0 4px}
.cele-s{color:var(--muted);font-size:13px;margin-bottom:18px}

@media(max-width:360px){.duo{grid-template-columns:1fr}.ach-grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const HUES=['#2aabee','#5b8cff','#8b74ff','#b266ff','#dd5cff'];
const initData=tg?.initData||'';
const state={page:'home',sub:'path',lang:'en',user:null,stats:{},tasks:[],campaigns:[],g:null,filter:'all',board:'e',
  tasksChannelUrl:'',channelRequired:false,checkUnavailable:false,type:'join',spinning:false,wheelRot:0,loaded:false,lastFetch:0};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const t=(k,v)=>{let s=(T[state.lang]&&T[state.lang][k])??T.en[k]??k;if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s;};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('en-US').format(Number(n||0));
const N=n=>`<span class="num">${fmt(n)}</span>`;
const ic=(n,c='')=>`<svg class="i ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const hue=i=>HUES[Math.max(0,Math.min(HUES.length-1,i||0))];
const haptic=(k='success')=>{try{tg?.HapticFeedback?.notificationOccurred(k)}catch(e){}};
const tick=()=>{try{tg?.HapticFeedback?.impactOccurred('light')}catch(e){}};

function dur(sec){sec=Math.max(0,Math.floor(sec));const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60);
  if(state.lang==='fa')return d?`${d} روز و ${h} ساعت`:h?`${h} ساعت و ${m} دقیقه`:`${m} دقیقه`;
  return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m`;}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.k);toast.k=setTimeout(()=>el.classList.remove('show'),3000);}
function errText(e){return apiErrors[state.lang]?.[e?.code]||e?.message||t('error');}
async function api(path,opt={}){
  const res=await fetch(path,{method:opt.method||'GET',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData},body:opt.body?JSON.stringify(opt.body):undefined});
  let data={};try{data=await res.json()}catch(_){}
  if(!res.ok){const e=new Error(data.message||t('netErr'));e.status=res.status;e.code=data.error;throw e;}
  return data;
}
function openLink(url){if(!url)return;if(tg?.openTelegramLink&&url.startsWith('https://t.me/'))tg.openTelegramLink(url);else if(tg?.openLink)tg.openLink(url);else window.open(url,'_blank','noopener');}

/* ---------- visuals ---------- */
/* Level badge: a gathering of members. Level 1 = you alone, each level adds more people; Legend adds a crown. */
const CROWD=[[[50,60,1.1]],[[30,58,.8],[70,58,.8]],[[38,44,.62],[62,44,.62]],[[14,60,.62],[86,60,.62]],[[24,44,.55],[76,44,.55]]];
function person(x,y,s,c,op,ghost,d){
  const w=11.5*s,top=y+s,bot=y+14*s,st=ghost?`fill="none" stroke="${c}" stroke-opacity=".6" stroke-width="1.1" stroke-dasharray="2.4 2.4"`:`fill="${c}" fill-opacity="${op}"`;
  return `<g class="p" style="--d:${d}s" ${st}><circle cx="${x}" cy="${(y-13*s).toFixed(1)}" r="${(7.2*s).toFixed(1)}"/><path d="M${(x-w).toFixed(1)} ${bot.toFixed(1)}C${(x-w).toFixed(1)} ${top.toFixed(1)} ${(x+w).toFixed(1)} ${top.toFixed(1)} ${(x+w).toFixed(1)} ${bot.toFixed(1)}Z"/></g>`;
}
function emblem(idx,cls='',ghost=false){
  const c=hue(idx);let list=[];
  for(let k=0;k<=idx;k++)CROWD[k].forEach((p,n)=>list.push([...p,k,n]));
  list.sort((a,b)=>a[2]-b[2]||a[1]-b[1]);
  let g='';
  if(ghost&&CROWD[idx+1])CROWD[idx+1].forEach((p,n)=>{g+=person(p[0],p[1],p[2],c,0,true,0)});
  const people=list.map((p,n)=>person(p[0],p[1],p[2],c,Math.min(1,.4+p[2]*.55),false,(n*.09).toFixed(2))).join('');
  const crown=idx>=4?`<path class="crown" d="M42 38.5l2.6-8 5.4 5 5.4-5 2.6 8z" fill="#ffd36b"/>`:'';
  return `<svg class="emb ${cls}" style="--c:${c}" viewBox="0 0 100 100" aria-hidden="true"><circle class="pulse" cx="50" cy="50" r="46" fill="none" stroke="${c}" stroke-width="1.5"/><circle cx="50" cy="50" r="46" fill="${c}" fill-opacity=".13" stroke="${c}" stroke-opacity=".5" stroke-width="1.6"/>${g}${people}${crown}</svg>`;
}
const lvl=()=>state.g?.level||{idx:state.user?.level||0,done:state.user?.doneTasks||0,progress:0,toGo:0,to:null,levels:[]};
const lvName=i=>lvl().levels[i]?.name||'';

const costs=()=>state.g?.costs||{join:4,react:3,view:2};
const tgPhoto=tg?.initDataUnsafe?.user?.photo_url||'';

/* ---------- cards ---------- */
function taskCard(x){
  const pend=x.completionStatus==='count_pending',live=!!x.started&&!pend;
  const gold=state.g?.golden?.active?state.g.golden.mult:1;
  let act;
  if(pend)act=`<div class="t-act"><span class="chip brand">${ic('clock','sm')}${t('pending')}</span></div>`;
  else if(!x.ready)act=`<div class="t-act"><button class="btn ghost" disabled>${t('unavailable')}</button></div>`;
  else act=`<div class="t-act"><button class="btn primary" data-act="task" data-id="${esc(x.id)}">${live?t('continueBtn'):t('start')}${ic('chev','sm flip')}</button></div>`;
  return `<article class="task ${live||pend?'live':''}" data-act="task" data-id="${esc(x.id)}"><div class="t-top"><div class="t-ico ${esc(x.type)}">${ic(typeIcon(x.type))}</div>
   <div class="grow"><div class="t-title">${esc(x.title)}</div><div class="t-meta"><span class="chip">${esc(x.typeLabel||t(x.type))}</span><span class="chip">${t('leftN',{n:fmt(x.remaining)})}</span>${live?`<span class="chip brand">${t('live')}</span>`:''}</div></div>
   <div class="t-reward"><span class="num">+${fmt(x.reward*gold)}</span><small>${t('stars')}${gold>1?' · <span class="num">x'+gold+'</span>':''}</small></div></div>${act}</article>`;
}
function campCard(c){

   <div class="camp-foot"><span>${t('doneOf',{d:fmt(c.done),t:fmt(c.target)})}</span><span>${c.progress}%</span></div>
   ${c.canStop?`<div class="t-act"><button class="btn ghost sm" data-act="stop" data-id="${esc(c.id)}">${ic('stop','sm')}${t('stop')}</button></div>`:''}</article>`;

  return '';

   ${nx&&lockPerks?`<div class="next-lock">${emblem(L.idx+1)}<div><b>${t('unlockAt',{level:esc(nx.name)})}</b><span>${esc(lockPerks)}</span></div></div>`:''}

function shrinkImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('img')),'image/jpeg',.88);};
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};im.src=url;
  });
}

}
async function reloadGrowth(){try{state.g=await api('/api/miniapp/growth');}catch(_){}}
function absorb(r){if(r.user){state.user=r.user;state.stats=r.stats||state.stats;}if(r.growth)state.g=r.growth;}

/* ---------- actions ---------- */
/* ---------- task flow: open -> do -> verify, all inside one sheet ---------- */
let tkTimer=null,pollTimer=null;
const tk=()=>state.tasks.find(x=>x.id===state.taskId);
const nowSrv=()=>Date.now()/1000+(state.skew||0);
const mmss=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
function sheetTask(){
  const x=tk();if(!x)return '';
  const gold=state.g?.golden?.active?state.g.golden.mult:1;
  const pend=x.completionStatus==='count_pending',live=!!x.started&&!pend,count=x.mode==='count';
  const open=x.type==='join'?t('tkOpenJoin'):t('tkOpenPost');
  const doit=x.type==='join'?t('tkDoJoin'):x.type==='react'?t('tkDoReact'):t('tkDoView');
  const li=(n,label,st,sub='')=>`<li class="${st}"><i>${st==='done'?ic('check','sm'):n}</i><div><b>${label}</b>${sub?`<span>${sub}</span>`:''}</div></li>`;
  const steps=li(1,open,live||pend?'done':'cur')+li(2,doit,pend?'done':live?'cur':'',count&&!live&&!pend?t('tkBackFast'):'')+li(3,t('tkVerify'),pend?'cur':'');
  const m=state.tmsg;
  const msg=pend?`<div class="tk-msg info">${ic('clock','sm')}<span>${t('pendingInfo')}</span></div>`:m?`<div class="tk-msg ${m.k}"><span>${esc(m.text)}</span></div>`:'';
  const timer=live&&x.deadline?`<div class="tk-timer">${ic('clock','sm')}<span id="tkTimer">${t('verifyWithin',{t:mmss(x.deadline-nowSrv())})}</span></div>`:'';
  let cta;
  if(state.tbusy)cta=`<button class="btn primary block" disabled><span class="spin"></span>${t('verifying')}</button>`;
  else if(pend)cta=`<button class="btn ghost block" disabled><span class="spin"></span>${t('verifying')}</button>`;
  else if(!x.ready)cta=`<button class="btn ghost block" disabled>${t('unavailable')}</button>`;
  else if(live)cta=`<div class="t-act"><button class="btn primary" data-act="tverify">${ic('check','sm')}${t('tkVerifyBtn')}</button><button class="btn ghost icon" data-act="tstart" aria-label="${t('openAgain')}" title="${t('openAgain')}">${ic('out','sm')}</button></div>`;
  else cta=`<button class="btn primary block" data-act="tstart">${ic('out','sm')}${open}</button>`;
  return `<div class="sheet-h"><b>${esc(x.typeLabel||t(x.type))}</b><button class="x" data-act="closesheet" aria-label="Close">${ic('x')}</button></div>
  <div class="tk-head"><div class="t-ico ${esc(x.type)}">${ic(typeIcon(x.type))}</div><div class="grow"><div class="t-title">${esc(x.title)}</div></div><div class="t-reward"><span class="num">+${fmt(x.reward*gold)}</span><small>${t('stars')}</small></div></div>
  <ol class="steps">${steps}</ol>${timer}${msg}<div style="margin-top:16px">${cta}</div>`;
}
function refreshTaskSheet(){if(state.taskId&&$('#sheetVeil').classList.contains('show')){const x=tk();if(!x){closeSheet();return;}$('#sheet').innerHTML=sheetTask();}}
function openTaskSheet(id){
  state.taskId=id;state.tmsg=null;state.tbusy=false;openSheet(sheetTask());
  clearInterval(tkTimer);
  tkTimer=setInterval(()=>{
    const x=tk();if(!x||!x.deadline||!x.started){return;}
    const left=x.deadline-nowSrv();
    if(left<=0){x.started=false;x.deadline=0;state.tmsg={k:'err',text:t('timeUp')};refreshTaskSheet();render();return;}
    const el=$('#tkTimer');if(el)el.textContent=t('verifyWithin',{t:mmss(left)});
  },1000);
}
async function tStart(){
  const x=tk();if(!x||state.tbusy)return;state.tmsg=null;state.tbusy=true;refreshTaskSheet();
  try{
    const r=await api(`/api/miniapp/tasks/${encodeURIComponent(x.id)}/start`,{method:'POST',body:{}});
    if(r.now)state.skew=r.now-Date.now()/1000;
    x.started=true;x.deadline=r.deadline||0;state.tbusy=false;refreshTaskSheet();render();tick();openLink(r.targetUrl||x.targetUrl);
  }catch(e){
    state.tbusy=false;state.tmsg={k:'err',text:e.code==='reaction_data_unavailable'?t('counterStale'):errText(e)};refreshTaskSheet();
    if(['task_unavailable','task_channel_required','task_paused'].includes(e.code))loadAll(true);
  }
}
async function tVerify(){
  const x=tk();if(!x||state.tbusy)return;state.tmsg=null;state.tbusy=true;refreshTaskSheet();
  const prev=state.user.level;
  try{
    const r=await api(`/api/miniapp/tasks/${encodeURIComponent(x.id)}/claim`,{method:'POST',body:{}});
    state.tbusy=false;
    if(r.status==='pending'){x.completionStatus='count_pending';refreshTaskSheet();render();schedulePoll();return;}
    absorb(r);state.tasks=state.tasks.filter(v=>v.id!==x.id);await reloadGrowth();closeSheet();render();bumpBal();
    const gold=state.g?.golden?.active;
    celebrate({k:t('verified'),v:'+'+fmt(r.reward*(gold?state.g.golden.mult:1)),s:gold?t('goldenBonus'):t('youEarned')+' '+t('stars')});
    $('#celeVeil').dataset.after=String(prev);
  }catch(e){
    state.tbusy=false;haptic('error');
    if(e.code==='reaction_window_expired'||e.code==='open_task_first'){x.started=false;x.deadline=0;render();}
    state.tmsg={k:'err',text:errText(e)};refreshTaskSheet();
  }
}
/* count-based reactions are confirmed by Telegram a few minutes later: watch for it instead of leaving the user guessing */
function schedulePoll(){
  clearTimeout(pollTimer);
  if(document.hidden||!state.user||!state.tasks.some(x=>x.completionStatus==='count_pending'))return;
  pollTimer=setTimeout(pollPending,6000);
}
const pendingIds=()=>state.tasks.filter(x=>x.completionStatus==='count_pending').map(x=>x.id);
async function afterPendingResolved(oldPend,beforePts,prevLevel){
  const paid=oldPend.filter(id=>!state.tasks.some(x=>x.id===id));
  if(!paid.length)return false;
  await reloadGrowth();if(state.taskId&&paid.includes(state.taskId))closeSheet();render();bumpBal();
  const gain=Math.max(0,(state.user?.points||0)-beforePts);
  if(gain>0){celebrate({k:t('verified'),v:'+'+fmt(gain),s:t('youEarned')+' '+t('stars')});$('#celeVeil').dataset.after=String(prevLevel);}
  return true;
}
async function pollPending(){
  const oldPend=pendingIds(),beforePts=state.user.points,prev=state.user.level;
  try{
    const [d,tk2]=await Promise.all([api('/api/miniapp/dashboard'),api('/api/miniapp/tasks')]);
    state.user=d.user;state.stats=d.stats;state.tasks=tk2.tasks||[];if(tk2.now)state.skew=tk2.now-Date.now()/1000;
    if(!await afterPendingResolved(oldPend,beforePts,prev)){render();refreshTaskSheet();}
  }catch(_){}
  schedulePoll();
}

async function claimGift(){
  const prev=state.user.level;
  try{const r=await api('/api/miniapp/gift/claim',{method:'POST',body:{}});absorb(r);render();bumpBal();
    celebrate({k:t('giftWon'),v:'+'+fmt(r.reward+r.milestone),s:t('streakN',{n:r.streak})});$('#celeVeil').dataset.after=String(prev);}
  catch(e){toast(errText(e));loadAll(true);}
}
async function spin(){
  if(state.spinning)return;state.spinning=true;render();
  try{
    const r=await api('/api/miniapp/wheel/spin',{method:'POST',body:{}});
    const n=r.growth.wheel.prizes.length,a=360/n,cur=state.wheelRot;
    let target=(Math.floor(cur/360)+5)*360+((360-r.index*a)%360);if(target<=cur)target+=360;
    state.wheelRot=target;const el=$('#wheelRot');if(el)el.style.transform=`rotate(${target}deg)`;tick();
    const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
    setTimeout(()=>{absorb(r);state.spinning=false;render();bumpBal();celebrate({k:t('youWon'),v:'+'+r.prize,s:t('wheelTitle')});},reduce?200:4400);
  }catch(e){state.spinning=false;render();toast(errText(e));loadAll(true);}
}
let calibTimer=null;
function stopCalib(){clearInterval(calibTimer);calibTimer=null;state.calib=null;}
function sheetCalib(){
  const c=state.calib;if(!c)return '';
  const li=(n,label,st,extra='')=>`<li class="${st}"><i>${st==='done'?ic('check','sm'):n}</i><div><b>${label}</b>${extra}</div></li>`;
  const status=c.err?`<div class="tk-msg err"><span>${esc(c.err)}</span></div>`:c.ready?`<div class="tk-msg ok">${ic('check','sm')}<span>${t('calReady')}</span></div>`:`<div class="tk-msg info"><span class="spin"></span><span>${t('calWaiting')}${c.total!=null?` · <span class="num">${fmt(c.total)}</span>`:''}</span></div>`;
  return `<div class="sheet-h"><b>${t('calTitle')}</b><button class="x" data-act="calcancel" aria-label="Close">${ic('x')}</button></div>
  <p class="muted" style="font-size:12.5px;margin:0 0 4px">${t('calWhy')}</p>
  <ol class="steps">${li(1,t('calStep1'),c.opened?'done':'cur',`<button class="btn ghost sm" style="margin-top:8px" data-act="calopen">${ic('out','sm')}${t('openPost')}</button>`)}${li(2,t('calStep2'),c.opened?'cur':'')}${li(3,t('calStep3'),c.ready?'done':'')}</ol>
  ${status}<button class="btn ghost block" style="margin-top:14px" data-act="calcancel">${t('cancel')}</button>`;
}
function refreshCalib(){if(state.calib&&$('#sheetVeil').classList.contains('show'))$('#sheet').innerHTML=sheetCalib();}
function startCalib(body){
  stopCalib();state.calib={body,ready:false,total:null,postUrl:'',err:'',opened:false,busy:false};
  openSheet(sheetCalib());calibCheck();calibTimer=setInterval(calibCheck,5000);
}
async function calibCheck(){
  const c=state.calib;if(!c||c.busy||c.ready)return;c.busy=true;
  try{
    const r=await api('/api/miniapp/campaigns/baseline',{method:'POST',body:{link:c.body.link}});
    c.postUrl=r.postUrl||c.postUrl;c.total=r.total;
    if(r.ready){c.ready=true;clearInterval(calibTimer);refreshCalib();haptic();c.busy=false;await submitCampaign(c.body,true);return;}
  }catch(e){c.err=errText(e);clearInterval(calibTimer);}
  c.busy=false;refreshCalib();
}
async function submitCampaign(body,fromCalib,btn){
  try{
    await api('/api/miniapp/campaigns',{method:'POST',body});
    stopCalib();closeSheet();toast(t('published'));haptic();await loadAll(true);go('grow');
  }catch(e){
    if(e.code==='baseline_pending'){
      if(!fromCalib)startCalib(body);
      else if(state.calib){state.calib.ready=false;state.calib.busy=false;clearInterval(calibTimer);calibTimer=setInterval(calibCheck,5000);refreshCalib();}
      return;
    }
    if(fromCalib&&state.calib){state.calib.err=errText(e);state.calib.ready=false;refreshCalib();return;}
    if(btn){btn.disabled=false;btn.textContent=t('publish');}
    toast(errText(e));
  }
}
async function publish(){
  const btn=$('#cGo'),link=$('#cLink').value.trim(),qty=Number($('#cQty').value),ty=state.type;
  if(!link){toast(apiErrors[state.lang].link);return;}
  if(!Number.isInteger(qty)||qty<1||qty>maxQty(ty)){toast(apiErrors[state.lang].quantity_range);return;}
  const body={type:ty,link,quantity:qty};if(ty==='react'){const on=$('#cWin .on');body.windowMin=Number(on?.dataset.m||5);}
  btn.disabled=true;btn.textContent=t('publishing');
  await submitCampaign(body,false,btn);
}
async function stopCampaign(id){
  const ok=await new Promise(res=>{if(tg?.showConfirm)tg.showConfirm(t('confirmStop'),res);else res(confirm(t('confirmStop')));});if(!ok)return;
  try{const r=await api(`/api/miniapp/campaigns/${encodeURIComponent(id)}/stop`,{method:'POST',body:{}});toast(t('stopped',{n:fmt(r.refunded)}));await loadAll(true);}
  catch(e){toast(errText(e));}
}
async function patchProfile(body){
  try{const r=await api('/api/miniapp/profile',{method:'PATCH',body});state.user=r.user;state.stats=r.stats||state.stats;setLang(r.user.language);if('language' in body)await reloadGrowth();render();toast(t('saved'));}
  catch(e){toast(errText(e));}
}
async function copyLink(){
  const l=state.g?.invite?.link;if(!l)return;
  try{await navigator.clipboard.writeText(l);}catch(_){const i=document.createElement('input');i.value=l;document.body.appendChild(i);i.select();try{document.execCommand('copy')}catch(__){}i.remove();}
  toast(t('copied'));tick();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const d=el.dataset;
  switch(d.act){
    case'go':go(d.p);break;
    case'sub':state.sub=d.s;render();break;
    case'filter':state.filter=d.f;render();break;
    case'board':state.board=d.b;render();break;
    case'wheelgo':state.sub='daily';go('rewards');break;
    case'task':openTaskSheet(d.id);break;
    case'tstart':tStart();break;
    case'tverify':tVerify();break;
    case'calopen':{const c=state.calib;if(c){c.opened=true;refreshCalib();openLink(c.postUrl||c.body.link);}break;}
    case'calcancel':closeSheet();break;
    case'gift':claimGift();break;
    case'spin':spin();break;
    case'create':state.type='join';openSheet(sheetCreate());updateSum();break;
    case'ctype':{const keep=$('#cLink')?.value||'';state.type=d.k;$('#sheet').innerHTML=sheetCreate();$('#cLink').value=keep;updateSum();break;}
    case'qty':$('#cQty').value=Math.max(1,Math.min(maxQty(state.type)||1,Number(d.n)||1));updateSum();break;
    case'win':$$('#cWin button').forEach(b=>b.classList.toggle('on',b===el));break;
    case'publish':publish();break;
    case'stop':stopCampaign(d.id);break;
    case'closesheet':closeSheet();break;
    case'closecele':{const v=$('#celeVeil');const prev=v.dataset.after;v.classList.remove('show');if(prev!==undefined&&prev!==''){delete v.dataset.after;checkLevelUp(Number(prev));}break;}
    case'url':openLink(d.u);break;
    case'refresh':loadAll();break;
    case'lang':if(d.l!==state.lang)patchProfile({language:d.l});break;
    case'remind':patchProfile({remindersOff:!state.user.remindersOff});break;
    case'copy':copyLink();break;
    case'sendbanner':sendBanner();break;
    case'editbanner':openSheet(sheetBanner());break;
    case'savebanner':saveBanner();break;
    case'pickimg':$('#bFile').click();break;
    case'rmimg':removeBannerImage();break;
    case'share':{const l=state.g?.invite?.link;if(l)openLink('https://t.me/share/url?url='+encodeURIComponent(l)+'&text='+encodeURIComponent(state.g.invite.banner?.shareText||t('shareText')));break;}
  }
});
document.addEventListener('change',e=>{if(e.target.id==='bFile'&&e.target.files[0])uploadBanner(e.target.files[0]);});
document.addEventListener('input',e=>{if(e.target.id==='cQty'||e.target.id==='cLink')updateSum();});
$('#sheetVeil').addEventListener('click',e=>{if(e.target.id==='sheetVeil')closeSheet();});
$('#celeVeil').addEventListener('click',e=>{if(e.target.id==='celeVeil')$('#celeVeil [data-act=closecele]')?.click();});
document.addEventListener('visibilitychange',()=>{if(document.hidden||!initData||!state.loaded)return;schedulePoll();const sheetOpen=$('#sheetVeil').classList.contains('show');if(Date.now()-state.lastFetch>4000&&!state.spinning&&(!sheetOpen||state.taskId))loadAll(true);});
if(tg?.onEvent)tg.onEvent('viewportChanged',()=>tg.expand());
loadAll();

})();
</script>
</body>
</html>
